<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBY - Essential By Design</title>
    <link rel="stylesheet" href="src/style.css">
    <!-- FontAwesome for Search, User, and Cart icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-left">
            <i class="fa-solid fa-truck-fast"></i> Free shipping over 10,000 kr.
        </div>
        <div class="top-bar-right">
            Service phone: 444-4400
        </div>
    </div>

    <!-- Main Header -->
    <header class="main-header">

        <nav class="nav-left">
            <a href="#">Clothing</a>
            <a href="#">Accessories</a>
            <a href="#">Styles</a>
            <a href="#">About Us</a>
        </nav>

        <div class="logo">
            <img src="img/ESY.png" alt="ESY-logo">
        </div>

        <div class="nav-right">
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search...">
            </div>
            <a href="#" class="icon-btn"><i class="fa-regular fa-user"></i></a>
            <a href="#" class="icon-btn cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-count">0</span>
            </a>
        </div>

    </header>


    <!-- Hero Section -->
    <section class="hero-section">

        <div class="hero-bg">
            <img src="img/jc-gellidon-81fEanp-xXc-unsplash.jpg" alt="Streetwear fashion model" />
        </div>

        <!-- Content Container (Right-aligned text box) -->
        <div class="hero-content">
            <h1>
                ESSENTIAL BY <br />
                <span>DESIGN</span>
            </h1>
            <p>
                Contemporary everyday essentials designed around simplicity, comfort and function. Inspired by
                Scandinavian minimalism and urban life, our pieces are made to move with you.
            </p>
        </div>

    </section>




</body>

</html>
